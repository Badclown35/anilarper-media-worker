<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anilarper Media Admin</title><style>
:root{color-scheme:dark}body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 16px;background:#101318;color:#f2f4f8}
.card{background:#1b222c;border:1px solid #303b49;border-radius:14px;padding:16px;margin:14px 0}
input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #4a5667;background:#202a36;color:inherit;box-sizing:border-box}
input:not([type=file]){width:100%;margin:6px 0 12px}input[type=file]{width:100%;margin:10px 0}
button{background:#8064dc;border:0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.5}
small,.muted{color:#aab4c2}progress{width:100%;height:18px}li{padding:10px 0;border-bottom:1px solid #303b49;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}a{color:#b7a4ff}
</style></head><body><h1>Anilarper Media</h1><p class="muted">Public library • Admin-only uploads and management • 10 GB storage cap</p>
<section class="card"><label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Enter your private admin token"></label>
<label>Display title<input id="title" placeholder="Optional; defaults to filename"></label>
<label>Category<input id="category" list="cats" value="Anime"></label><datalist id="cats"><option>Anime</option><option>Movies</option><option>Episodes</option><option>Clips</option><option>Trailers</option><option>Other</option></datalist>
<input id="files" type="file" accept="video/mp4,.mp4" multiple><button id="upload">Upload selected MP4s</button>
<p id="status" class="muted" aria-live="polite">Enter your token to manage the library.</p><progress id="progress" value="0" max="100" hidden></progress></section>
<section class="card"><div class="actions"><h2 style="flex:1;margin:0">Public videos</h2><button id="recover">Recover stored uploads</button><button id="refresh">Refresh</button></div>
<p id="usage" class="muted"></p><ul id="videos" style="list-style:none;padding:0"></ul></section>
<script>
const $=id=>document.getElementById(id),token=$('token'),status=$('status'),progress=$('progress');
const auth=()=>({'Authorization':'Bearer '+token.value.trim(),'Content-Type':'application/json'});
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...auth(),...(opts.headers||{})}});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function refresh(){try{const j=await fetch('/api/videos').then(r=>r.json()),list=$('videos');list.replaceChildren();let total=0;for(const v of j.videos){total+=v.size;const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('div'),buttons=document.createElement('div');a.href=v.streamPath;a.textContent=v.title;a.target='_blank';meta.className='muted';meta.textContent=v.category+' • '+(v.size/1048576).toFixed(1)+' MB';buttons.className='actions';const edit=document.createElement('button');edit.textContent='Organize';edit.onclick=async()=>{const title=prompt('Title',v.title);if(title===null)return;const category=prompt('Category',v.category);if(category===null)return;try{await api('/api/videos/'+encodeURIComponent(v.id)+'/metadata',{method:'POST',body:JSON.stringify({title,category})});await refresh()}catch(e){status.textContent=e.message}};const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+v.title+'?'))return;try{await api('/api/videos/'+encodeURIComponent(v.id),{method:'DELETE'});await refresh()}catch(e){status.textContent=e.message}};buttons.append(edit,del);li.append(a,meta,buttons);list.append(li)}const pending=Number(j.storage&&j.storage.pendingBytes||0),combined=total+pending;$('usage').textContent=(combined/1e9).toFixed(2)+' / 10.00 GB used'+(pending?' • '+(pending/1e9).toFixed(2)+' GB uploading':'');$('usage').style.color=combined>=8000000000?'#ffbd6b':'#aab4c2';if(combined>=8000000000)status.textContent='Storage warning: you are approaching the 10 GB free limit.';if(!j.videos.length)list.textContent='No videos uploaded yet.'}catch(e){status.textContent='Could not load library: '+e.message}}
async function uploadFile(file){if(file.size<=0)throw new Error('Empty file: '+file.name);const start=await api('/api/upload/start',{method:'POST',body:JSON.stringify({filename:file.name,title:$('title').value,category:$('category').value,size:file.size})}),parts=[],partSize=start.partSize,total=Math.ceil(file.size/partSize);try{for(let i=0;i<total;i++){const chunk=file.slice(i*partSize,Math.min(file.size,(i+1)*partSize));status.textContent='Uploading '+file.name+' • part '+(i+1)+'/'+total;const r=await fetch('/api/upload/part?id='+encodeURIComponent(start.id)+'&uploadId='+encodeURIComponent(start.uploadId)+'&partNumber='+(i+1),{method:'PUT',headers:auth(),body:chunk}),p=await r.json();if(!r.ok)throw new Error(p.error||'Part upload failed');parts.push(p);progress.value=(i+1)/total*100}await api('/api/upload/complete',{method:'POST',body:JSON.stringify({id:start.id,uploadId:start.uploadId,parts})});status.textContent='Uploaded '+file.name}catch(e){try{await api('/api/upload/abort',{method:'POST',body:JSON.stringify({id:start.id,uploadId:start.uploadId})})}catch(ignore){}throw e}}
$('upload').onclick=async()=>{if(!token.value.trim())return status.textContent='Enter your admin token.';const files=[...$('files').files];if(!files.length)return status.textContent='Choose MP4 files first.';$('upload').disabled=true;progress.hidden=false;try{for(const f of files)await uploadFile(f);status.textContent='All selected files uploaded.';$('files').value='';await refresh()}catch(e){status.textContent='Upload stopped: '+e.message}finally{$('upload').disabled=false;progress.hidden=true;progress.value=0}};
$('recover').onclick=async()=>{if(!token.value.trim())return status.textContent='Enter your admin token to recover stored uploads.';const button=$('recover');button.disabled=true;status.textContent='Checking stored uploads...';try{const result=await api('/api/upload/recover',{method:'POST',body:'{}'});status.textContent='Recovered '+result.recovered+' stored video(s). '+result.remaining+' still pending.'+(result.errors&&result.errors.length?' Some files could not be checked; see storage permissions.':'');await refresh()}catch(e){status.textContent='Recovery failed: '+e.message}finally{button.disabled=false}};$('refresh').onclick=refresh;refresh();
</script></body></html>
